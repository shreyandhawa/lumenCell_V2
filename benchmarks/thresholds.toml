# Accuracy gates for trajectory methods.
#
# A method that misses any gate on any case ships labelled "experimental", with
# its measured scores shown in the UI. Thresholds are never lowered to make a
# method pass; every change to a threshold or to a metric's definition is logged
# below with the reason.

[synthetic]
preset = "realistic"
topologies = ["linear", "bifurcation", "trifurcation", "binary2"]
seeds = [0, 1, 2]
n_cells = 3000
n_genes = 2000

[synthetic.gates]
pt_spearman_global = { min = 0.90 }
pt_spearman_lineage = { min = 0.85 }
branch_accuracy = { min = 0.90 }  # NaN (single-lineage topologies) is skipped
lineage_recall = { min = 1.0 }
n_spurious = { max = 1 }
root_pt_excess = { max = 0.10 }
clonal_excess_ratio = { min = 0.5, nan = "fail", status = "clonal_status" }  # see [clonal]
clonal_p = { max = 0.01, nan = "fail", status = "clonal_status" }

# Real datasets: a release gate (make bench-real), never run in CI. Set from the
# approved M1 plan and written down before the first real run (2026-11-10).
[real.pancreas.gates]
pt_spearman_lineage = { min = 0.70 }  # Alpha and Beta, against stage order
branch_accuracy = { min = 0.80 }      # Alpha and Beta cells on their own lineage
lineage_recall = { min = 1.0 }

[real.bonemarrow.gates]
pt_spearman_lineage = { min = 0.70 }  # Ery and Mono
branch_accuracy = { min = 0.75 }
lineage_recall = { min = 1.0 }

[real.gastrulation_erythroid.gates]
pt_spearman_global = { min = 0.60 }   # against real embryo time (E7.0-E8.5)
terminal_share = { min = 0.80 }       # Erythroid3 cells on one inferred lineage

# ---- clonal agreement (spec docs/superpowers/specs/2026-11-12-tcell-clonotypes-design.md §4.3-4.5)
# Defined before any clonal score was computed. src/lumencell/trust/constants.py mirrors what the
# worker needs at run time; tests/unit/test_trust_constants.py keeps the two equal.
# Clone: the pair (donor, label). A missing, empty, "nan" or "None" label means no receptor.
# Scored cells: single-lineage cells with a label whose clone has >= m such cells.
#   own-cells mode (API): the run's single-lineage cells, counted in their lineage.
#   oracle-cells mode (gates): the true lineages' single-lineage cells, weighted by the method's
#   masks: one lineage 1, k lineages 1/k each, none 1/L each (L = the method's lineages).
# H_k = -sum_l p_kl log p_kl / log L; H = sum_k n_k H_k / sum_k n_k; purity P = 1 - H.
# Clone-weighted purity = 1 - (1/K) sum_k H_k: every clone weighted equally (spec §4.3).
# Purity without the largest clone leaves out the clone with the most scored cells; on a size
#   tie, the purer one (lower H_k) is left out; NaN with one clone.
# eta = 1 - H_obs / E_null[H], reported against each null; headline eta is against N1.
# Nulls shuffle clone identities among the scored cells, B times, seeded, within:
#   N1 donor; N2 donor x decile of pseudotime (the run's own; the truth's order for the oracle;
#   cells without pseudotime form their own stratum); N3 donor x strata_keys, when declared.
# N2 deciles are taken over the scored cells' finite pseudotime by average rank:
#   decile = min(bins - 1, floor(bins * (average rank - 1) / n_finite)); cells with NaN
#   pseudotime form a bin of their own.
# p = (1 + #{H_b <= H_obs}) / (B + 1), one-sided; headline p = the largest over computed nulls.
# Lineage-free baseline: scipy.cluster.vq.kmeans2 with k = L, seeded, on the PCs the kNN graph
#   uses, scored on the same cells: eta_base, delta_eta = eta - eta_base, and a paired
#   permutation p for delta_eta over the same N1 shuffles.
# Coupling (reported, never gated): cosine similarity of the raw scored-cell count columns of
#   each lineage pair, against N1: z, p and Benjamini-Hochberg p_adj. Not CoSpar's normalised
#   default. It says two lineages share clones, never which came first.
# Every score also reports cells and clones scored, the effective clone count (inverse Simpson
#   index of scored mass, 1 / sum_k (n_k / N)^2) and the same block at m = 3.
# Sources: STARTRAC, Zhang et al., Nature 2018, doi:10.1038/s41586-018-0694-x (purity);
#   LRT, Xie et al., PLoS Comput Biol 2023, doi:10.1371/journal.pcbi.1011300 (lineage bias);
#   CoSpar, Wang et al., Nat Biotechnol 2022, doi:10.1038/s41587-022-01209-1 (coupling);
#   Vinh, Epps & Bailey, JMLR 11(95):2837-2854, 2010, jmlr.org/papers/v11/vinh10a.html, no DOI,
#   checked 2026-11-12 (chance-corrected eta);
#   Phipson & Smyth, Stat Appl Genet Mol Biol 9(1), 2010, doi:10.2202/1544-6115.1585, checked
#   2026-11-12 (p never zero);
#   Sturm et al., Bioinformatics 36(18):4817-4818, 2020, doi:10.1093/bioinformatics/btaa611, and
#   Schattgen et al., Nat Biotechnol 40:54-63, 2022, doi:10.1038/s41587-021-00989-2, both checked
#   2026-11-12 (clones are transcriptionally coherent, hence the lineage-free baseline).
[clonal]
metric_version = 1
min_clone_size = 2          # primary m; single-cell clones never contribute
sensitivity_clone_size = 3  # always reported alongside
min_clones = 20             # fewer scored clones: too_few_clones, values reported, never a pass
n_permutations = 1000       # B per null
seed = 0
pseudotime_bins = 10
p_max = 0.01                # the clonal_p gate, and phase 2's C5

[clonal.synthetic]
fate_bias = 0.7             # every branching matrix case gets this clonal layer
n_donors = 3
label_rate = 0.85           # share of cells with a receptor, near 10x capture rates
singleton_share = 0.5       # clone size: 1 with this probability, else 1 + Zipf(zipf_a)
zipf_a = 2.2
donor_confound_share = 0.8  # donor-confound control: share of lineage j's cells in donor j mod D
oracle_eta_min = 0.05       # below either oracle floor the case is not_assessable (and fails)
oracle_p_max = 0.01

[clonal.calibration]
# Slow, run once and recorded (tests/clonal/test_calibration.py), at the [synthetic] preset and
# size. Seeds are disjoint from the gated matrix. Seed s uses topologies[(s - seed_start) % 3].
seed_start = 100
n_seeds = 200
topologies = ["bifurcation", "trifurcation", "binary2"]
depth_only_topology = "binary2"   # the topology whose lineages occupy different depths
alpha = 0.05
binomial_quantile = 0.99          # binom.ppf(0.99, 200, 0.05) = 18 rejections at most
monotonic_fate_bias = [0.0, 0.35, 0.7, 1.0]
monotonic_seeds = [0, 1, 2]
monotonic_topologies = ["bifurcation", "trifurcation", "binary2"]
# 2026-11-13  Pre-declared before the 200-seed run, so that no count has been seen. A p-value that
#   is NaN (an undefined score) is stored as null, never counted as a rejection and never as a
#   non-rejection. Such seeds are counted apart (n_nan) and reported per check. The rejection
#   bound uses the number of seeds that scored: bound = int(binom.ppf(binomial_quantile,
#   n_scored, alpha)), which is 18 when all 200 seeds score. A check passes (or, for a control
#   that must fail, fails) by comparing its rejections, p <= alpha, to that bound. A seed whose
#   method raises is a NaN p as well, and its error is listed in the report. No seed, definition
#   or threshold is changed after the run; a failed check is recorded as a failure.

[regression]
# CI fails if a synthetic metric falls further than this below benchmarks/baseline.json.
max_drop = 0.03

# ---- changelog ---------------------------------------------------------------------
#
# 2026-11-10  Initial gates, set before any method was measured.
#
# 2026-11-10  Two metric definitions corrected after the first paga_dpt run.
#             Thresholds unchanged.
#   * root_pt_median -> root_pt_excess. The true root population (first half of
#     the trunk) spans true pseudotime 0-0.2, so even perfect inference gives a
#     median near 0.10 and the original gate (<= 0.10) was unpassable by design.
#     The gate now applies to the excess over the true median.
#   * branch_accuracy and lineage matching now count only cells at least 0.15
#     (true pseudotime) past their fork. The generator ramps branch expression in
#     from zero at a fork, so earlier cells are indistinguishable for any method;
#     the realistic preset's calibration measures branch purity on the same region.
#     The all-cells figure is still reported as branch_accuracy_all.
#     Side effect, stated openly: a lineage that wrongly runs through a sibling
#     branch's cluster can now reach the 0.6 Jaccard needed to count as "found"
#     (paga_dpt, trifurcation seeds 0-1). That error still fails the
#     branch_accuracy gate, which counts the misplaced cells.
#
# 2026-11-10  Real-dataset gates added, before any method was run on real data.
#   The plan's "share of Erythroid3 cells on the main lineage" is implemented as
#   terminal_share (worst expected lineage's terminal-stage cells held by one
#   inferred lineage).
#
# 2026-11-12  Clonal agreement: definitions above and two synthetic gates, set before any
#   clonal score was computed. clonal_excess_ratio = eta_method / eta_oracle >= 0.5: a method
#   whose lineages capture less than half of the chance-corrected clonal signal of the true
#   lineages is not separating the fates the clones show. clonal_p <= 0.01: with B = 1000 the
#   smallest p is about 0.001 and its Monte Carlo error at the boundary about 0.003. A case is
#   assessable only if the oracle has eta >= 0.05 and headline p <= 0.01. These two gates fail
#   on NaN and on every status but ok (too_few_clones, failed, not_assessable, single_lineage,
#   not_measured), except not_applicable (fewer than 2 true lineages, or a real dataset with
#   no clone data); a synthetic branching truth with no clone data is not_measured and fails.
#   Every other gate still skips NaN. The clonal gate is not a branch gate: merging two true
#   lineages can push the ratio above 1, and lineage_recall catches that.
#
# 2026-11-13  Calibration run, results in benchmarks/results/clonal-calibration-2026-11-13.json
#   (200 seeds, bound 18, no NaN p-values, no method error): null/paga_dpt 6, null/palantir 7,
#   null/scfates_ppt 6 rejections, calibrated; donor_confound/N1 7, calibrated;
#   donor_confound/N1_donors_ignored 200, not calibrated as it must be; depth_only/N1 200, not
#   calibrated as it must be; depth_only/N2 57, NOT calibrated: FAILED. Oracle eta rises with
#   fate_bias and p at fate_bias 0 is above 0.01 on all 9 monotonic cases. No threshold or
#   definition changed.
#
# 2026-11-13  TR-gene exclusion re-run (Task 9). Results in benchmarks/results/real-2026-11-13.json,
#   run at 4b0b1d5; compared with real-2026-11-10.json (run at abe3f73, before the exclusion).
#   Receptor genes matched, and how many of them the old selection would have kept as HVGs:
#   pancreas 0 matched, 0 would have been HVGs; bonemarrow 11 matched, 6; gastrulation_erythroid
#   258 matched, 3. (The 258 in the mouse embryo is the case-insensitive pattern matching more than
#   TCR genes; the exclusion applies as specified.) Real rows now carry clonal_status =
#   not_applicable. Moved: pancreas no metric moved. bonemarrow moved on all three methods, and
#   n_clusters 12 -> 13. paga_dpt branch_accuracy 0.917 -> 0.617 and lineage_recall 1.0 -> 0.5, both
#   now failing their gates; scfates_ppt pt_spearman_lineage 0.781 -> 0.668 now fails its gate;
#   palantir branch_accuracy 0.639 -> 0.943 and terminal_share 0.839 -> 0.986 improved.
#   gastrulation_erythroid: paga_dpt lineage_recall 0.0 -> 1.0, other metrics within 0.002 except
#   palantir terminal_share 0.591 -> 0.579. The old file predates other engine and prep commits, so
#   the movement is not all attributable to the exclusion. Thresholds unchanged.
