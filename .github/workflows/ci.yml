name: CI

# The same gate as `make ci` locally: Python lint, types and tests, the API
# contract check, the web app's lint, types, tests and build, and the Playwright
# end-to-end test against the real server.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: make ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_LOCKED: "1"  # fail on a uv.lock that is out of date instead of resolving it again
    steps:
      - uses: actions/checkout@v7

      # Python 3.13, from .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: make install

      # Their tests skip when the import fails, which would pass CI without them.
      - name: Check that the Palantir and scFates adapters can import their packages
        run: uv run python -c "import palantir, scFates"

      # Restore and save are separate steps because actions/cache saves only when
      # the whole job succeeds, so main never got a cache. Pull requests can
      # restore a cache saved on main, but main cannot restore one saved by a PR.
      - name: Restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # From Playwright's download server; no apt involved.
      - name: Install Playwright Chromium
        id: chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install chromium

      # Saved straight after the download, so a failure later in the job still
      # leaves a cache. Never after a failed download: a cache key cannot be overwritten.
      - name: Save the Playwright browser cache
        if: always() && steps.chromium.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      # Uses apt, whose Ubuntu mirrors sometimes fail to resolve on the runner. Each
      # try is capped at 3 minutes (a healthy one takes under a minute) and runs as
      # root, so the timeout can stop apt and release its locks before the next try.
      - name: Install Playwright's system libraries
        working-directory: web
        timeout-minutes: 15
        run: |
          for try in 1 2 3; do
            status=0
            sudo env "PATH=$PATH" timeout --kill-after=30s 3m npx playwright install-deps chromium || status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$try" -lt 3 ]; then
              echo "::warning::Installing Playwright's system libraries failed (try $try of 3, exit $status). Retrying in $((try * 30)) s."
              sleep $((try * 30))
            fi
          done
          echo "::error::Could not install Playwright's system libraries after 3 tries (last exit $status; 124 or 137 means it hit the 3-minute limit). apt could not reach Ubuntu's mirrors; see the log above."
          exit 1

      # typer forces rich's terminal styling when GITHUB_ACTIONS is set, which splits
      # option names in CLI errors with colour codes; the CLI tests read plain text,
      # as on a developer's machine. Nothing in `make ci` needs the variable.
      - name: make ci
        run: env -u GITHUB_ACTIONS make ci

      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: web/test-results/
          if-no-files-found: ignore
